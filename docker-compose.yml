
services:
  voicetts1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/nvidia/cuda:12.4.0-devel-ubuntu22.04}
    image: voicetts:dev
    container_name: voicetts1
    working_dir: /app
    command: python server.py --host 0.0.0.0 --port 8021 --workers 1
    ports:
      - "8021:8021"
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_CACHE=/app/models/hf_cache
      - CUDA_VISIBLE_DEVICES=0
      - TZ=Asia/Shanghai
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_AUDIO_EXPIRE=${REDIS_AUDIO_EXPIRE:-3600}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
    network_mode: host
    restart: unless-stopped
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

